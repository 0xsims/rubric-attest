name: Release

# Publishes the @0xsims/* packages to npm when a version tag (v*) is pushed.
# Requires a repository secret NPM_TOKEN: an npm automation token with publish
# rights to the @0xsims scope. The token is only ever read by npm on the runner
# via NODE_AUTH_TOKEN; it is never exposed to logs.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install (clean)
        run: npm ci

      - name: Tag must match package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/attest-decision/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package version $PKG"
            exit 1
          fi
          echo "Releasing v$TAG"

      - name: Verify (lint + typecheck + test + build)
        run: |
          npm run check
          npm run build

      - name: Publish to npm
        run: npm publish --workspaces --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
