version: 2
updates:
  # npm dependencies (single root lockfile covers the whole workspace).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch routine minor/patch bumps into one PR; majors stay separate.
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
